name: tests

# The offline suite (fakes; no key, no network) — the same 146 tests the README
# claims. CI exists so that claim is third-party verifiable, not self-reported.
#
# The checks after the suite exist because the defects this project has actually
# shipped were not failures of the tests but gaps in their reach: a CLI module at
# 0% coverage hid a flag that did not do what its help text promised, and a
# package move broke a downstream consumer that no test on either side imported.
# A green suite is evidence about the code it touches and nothing more, so the
# build also fails when a module is unreached or when the docs quote a stale count.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e '.[dev]'

      - name: suite and coverage
        run: >
          python -m pytest -q --cov --cov-report=term-missing
          --cov-report=json --cov-fail-under=82

      - name: every module must be reached by at least one test
        run: |
          python - <<'PY'
          import json, sys
          files = json.load(open("coverage.json"))["files"]
          unreached = sorted(f for f, d in files.items()
                             if d["summary"]["percent_covered"] == 0)
          if unreached:
              sys.exit("no test reaches: " + ", ".join(unreached))
          print(f"all {len(files)} modules are reached")
          PY

      - name: the count the docs quote must be the count that ran
        run: |
          n=$(python -m pytest --collect-only -q | tail -1 | grep -oE '^[0-9]+')
          grep -q "$n tests" README.md \
            || { echo "README does not say '$n tests'"; exit 1; }
          grep -q "same $n tests" .github/workflows/ci.yml \
            || { echo "this workflow's own comment does not say '$n tests'"; exit 1; }
          echo "docs and suite agree: $n tests"

      - name: every section of the design must be pinned by a test
        run: |
          python - <<'PY'
          import pathlib, re, sys
          design = pathlib.Path("docs/DESIGN.md").read_text(encoding="utf-8")
          sections = re.findall(r"^## §(\d+)\s", design, re.M)
          if not sections:
              sys.exit("docs/DESIGN.md declares no numbered sections")
          tests = "\n".join(p.read_text(encoding="utf-8")
                            for p in pathlib.Path("tests").glob("*.py"))
          # citing §4.3 counts as citing §4 — a subsection belongs to its section
          unpinned = [n for n in sections if not re.search(rf"§{n}(?!\d)", tests)]
          if unpinned:
              sys.exit("no test cites design " + ", ".join(f"§{n}" for n in unpinned)
                       + " — a written rule nobody checks is one the next change breaks")
          print(f"all {len(sections)} design sections are pinned by a test")
          PY
